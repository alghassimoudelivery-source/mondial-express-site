# Construit l'application Android (APK) à chaque modification du dossier mobile/,
# et la publie dans la release « application-android » du dépôt (lien de téléchargement fixe).
name: Application Android

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      # Clé Google Play : secrets ANDROID_KEYSTORE_BASE64 et ANDROID_KEY_PASSWORD (Settings > Secrets > Actions).
      # Sans ces secrets, l'APK est signé avec la clé de démonstration et le fichier AAB n'est pas produit.
      - name: Clé de signature
        id: cle
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > android/upload.jks
            printf 'storeFile=../upload.jks\nstorePassword=%s\nkeyAlias=upload\nkeyPassword=%s\n' "$PW" "$PW" > android/key.properties
            echo "signe=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Construire l'APK
        run: flutter build apk --release --build-number ${{ github.run_number }}
      - name: Construire l'AAB (Google Play)
        if: steps.cle.outputs.signe == '1'
        run: |
          flutter build appbundle --release --build-number ${{ github.run_number }}
          cp build/app/outputs/bundle/release/app-release.aab build/Mondial-Express.aab
      - name: Renommer
        run: cp build/app/outputs/flutter-apk/app-release.apk build/Mondial-Express.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Mondial-Express-android
          path: |
            mobile/build/Mondial-Express.apk
            mobile/build/Mondial-Express.aab
          if-no-files-found: warn
      - name: Publier dans la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete application-android --yes --cleanup-tag 2>/dev/null || true
          FILES="build/Mondial-Express.apk"; [ -f build/Mondial-Express.aab ] && FILES="$FILES build/Mondial-Express.aab"
          gh release create application-android $FILES \
            --title "Application Android Mondial Express (build ${{ github.run_number }})" \
            --notes "APK à installer sur un téléphone Android ; AAB à envoyer sur Google Play (si la clé est configurée). Construit automatiquement depuis le dossier mobile/ (commit ${{ github.sha }})." \
            --target ${{ github.sha }}
